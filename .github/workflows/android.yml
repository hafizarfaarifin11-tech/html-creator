name: Build HTML Maker APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE"
          SETTINGS_FILE="$(find "$SEARCH_ROOT" \
            -type f -name 'settings.gradle' \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          # If the repository contains the project ZIP instead of extracted files,
          # unpack it automatically and search again.
          if [ -z "$SETTINGS_FILE" ]; then
            mapfile -t ZIP_FILES < <(find "$GITHUB_WORKSPACE" -maxdepth 4 \
              -type f -iname '*.zip' -not -path '*/.git/*' -print)

            if [ "${#ZIP_FILES[@]}" -gt 0 ]; then
              EXTRACT_DIR="$RUNNER_TEMP/html-maker-extracted"
              mkdir -p "$EXTRACT_DIR"
              for ZIP_FILE in "${ZIP_FILES[@]}"; do
                echo "Extracting: $ZIP_FILE"
                unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"
              done
              SEARCH_ROOT="$EXTRACT_DIR"
              SETTINGS_FILE="$(find "$SEARCH_ROOT" \
                -type f -name 'settings.gradle' \
                -not -path '*/.gradle/*' \
                -print -quit || true)"
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::File settings.gradle belum ditemukan."
            echo "Pastikan repository berisi seluruh source project atau unggah ZIP HTML Maker."
            echo "Isi repository (maksimal 4 tingkat):"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::settings.gradle ditemukan, tetapi app/build.gradle tidak ada di $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.9"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Maker-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
